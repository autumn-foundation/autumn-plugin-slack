[package]
name = "autumn-plugin-slack"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "Slack plugin for autumn-web: verified Events API, slash commands, interactivity, and a Web API client"
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/autumn-plugin-slack"
readme = "README.md"
keywords = ["autumn", "slack", "bot", "webhook", "chatops"]
categories = ["web-programming", "api-bindings"]

[dependencies]
autumn-web = { version = "0.8.0", default-features = false }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
url = "2"

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# `pub(crate)` marks crate-internal items on purpose.
redundant_pub_crate = "allow"
